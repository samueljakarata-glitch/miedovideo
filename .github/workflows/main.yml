name: Generar video
on: workflow_dispatch
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pillow matplotlib edge-tts
      - run: python hombre_fotografias.py
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: el_hombre_fotografias.mp4
          retention-days: 7
          compression-level: 0
